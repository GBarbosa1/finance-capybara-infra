name: Deploy Finance Capybara Infrastructure

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finance-capybara-infra-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      BUCKET_NAME_SUFFIX: ${{ vars.S3_BUCKET_NAME_SUFFIX }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment configuration
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || { echo "Missing AWS_ROLE_TO_ASSUME secret"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: fcb-infra-github-actions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deploy script dependencies
        run: pip install -r requirements.txt
      - name: Ensure the pivoter ECR repository exists
        id: pivoter-ecr
        run: |
          repository_url=$(python deploy.py --ecr-repo-only)
          echo "repository_url=${repository_url}" >> "$GITHUB_OUTPUT"
          echo "repository_url_host=${repository_url%%/*}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Log in to the pivoter ECR repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ steps.pivoter-ecr.outputs.repository_url_host }}
      - name: Build and push the pivoter image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: infra/lambda/pivoter
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.pivoter-ecr.outputs.repository_url }}:${{ github.sha }}
      - name: Deploy infrastructure and both Lambda functions
        run: >-
          python deploy.py
          --pivoter-image-uri "${{ steps.pivoter-ecr.outputs.repository_url }}:${{ github.sha }}"
          --bucket-suffix "${BUCKET_NAME_SUFFIX}"
