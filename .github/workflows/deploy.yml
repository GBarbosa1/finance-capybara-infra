name: Deploy Finance Capybara Infrastructure

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finance-capybara-infra-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_bucket_name_suffix: ${{ vars.S3_BUCKET_NAME_SUFFIX }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
      - name: Check deployment configuration
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "Missing TF_STATE_BUCKET secret"; exit 1; }
          test -n "$AWS_ROLE_TO_ASSUME" || { echo "Missing AWS_ROLE_TO_ASSUME secret"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: fcb-infra-github-actions
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize existing state backend
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=finance-capybara-infra/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Validate Terraform
        run: terraform validate
      - name: Test infrastructure contracts without AWS resources
        run: terraform test
      - name: Plan infrastructure
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Apply the saved plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
