name: Deploy Finance Capybara Infrastructure

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/deploy.yml
      - infra/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: finance-capybara-infra-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: finance-capybara-infra-github-actions
      - run: terraform fmt -check
      - run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=finance-capybara-infra/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false -auto-approve tfplan
