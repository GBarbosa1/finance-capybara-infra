name: Validate Finance Capybara Infrastructure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fcb-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deploy script and Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check deploy.py syntax
        run: python -m py_compile infra/deploy.py
      - name: Install pivoter Lambda test dependencies
        run: pip install -r infra/lambda/pivoter/requirements-dev.txt
      - name: Run pivoter Lambda tests
        run: pytest
        working-directory: infra/lambda/pivoter
      - name: Install aggregator Lambda test dependencies
        run: pip install -r infra/lambda/aggregator/requirements-dev.txt
      - name: Run aggregator Lambda tests
        run: pytest
        working-directory: infra/lambda/aggregator
